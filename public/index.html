<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Assignment Checker 🤖</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Prompt:wght@300;400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="app-container">
        <header style="position: relative;">
            <h1>Java Lab Auto-Grader</h1>
            <p>อัปโหลดไฟล์คำตอบ (PDF/DOCX) เพื่อตรวจคะแนนและรับคำแนะนำจาก AI</p>
            <div id="model-badge" class="model-badge hidden">
                <span class="model-icon">🧠</span> <span id="model-name">Loading...</span>
            </div>
        </header>

        <main>
            <section class="upload-section">
                <div id="drop-zone" class="drop-zone">
                    <div class="drop-zone-content">
                        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="upload-icon">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                        <p class="drop-text">ลากไฟล์มาวางที่นี่ หรือ <strong>คลิกเพื่อเลือกไฟล์</strong></p>
                        <span class="file-hint">รองรับไฟล์ .pdf และ .docx เท่านั้น</span>
                        <input type="file" id="file-input" accept=".pdf,.docx" hidden>
                    </div>
                </div>
                <div id="selected-file" class="selected-file hidden">
                    <span id="file-name">filename.pdf</span>
                    <button id="remove-file" class="btn-icon">✕</button>
                </div>
                <button id="submit-btn" class="btn primary" disabled>ตรวจกระดาษคำตอบ</button>
            </section>

            <section id="loading-state" class="loading-state hidden">
                <div class="spinner"></div>
                <p>กำลังตรวจคำตอบ และวิเคราะห์ด้วย AI...</p>
            </section>

            <section id="result-section" class="result-section hidden">
                <div class="score-card">
                    <h2>คะแนนที่ได้</h2>
                    <div class="score-circle">
                        <span id="score-value">0</span>
                        <span class="score-divider">/</span>
                        <span id="score-max">0</span>
                    </div>
                </div>

                <div class="details-section">
                    <h3>รายละเอียดข้อที่ผิด ❌</h3>
                    <div id="incorrect-list" class="incorrect-list">
                        <!-- Items injected by JS -->
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>

</html>
</body>

</html>
